  #game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; cursor: crosshair; }
  #top { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 6px; align-items: center; pointer-events: none; }
  #title { font-size: 13px; padding: 5px 9px; background: rgba(20,16,30,.72); border: 2px solid var(--line); border-radius: 6px; pointer-events: auto; }
  #count { font-size: 11px; color: var(--dim); padding: 5px 8px; background: rgba(20,16,30,.6); border-radius: 6px; }
  #top .sp { flex: 1; }
  .ctl { pointer-events: auto; font-size: 16px; width: 38px; height: 34px; border-radius: 6px; border: 2px solid var(--line);
    background: rgba(31,24,48,.85); color: var(--ink); cursor: pointer; padding: 0; font-family: inherit; }
  .ctl.on { border-color: var(--accent); background: #3a2d18; }
  #panel { background: var(--panel); border-top: 3px solid var(--line); padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); }
  #hint { font-size: 11px; color: var(--dim); line-height: 1.5; min-height: 2.9em; padding: 0 2px 5px; }
  #hint b { color: var(--accent); font-weight: 400; margin-right: 4px; }
  #tabs { display: flex; gap: 4px; margin-bottom: 6px; overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs button { flex: 0 0 auto; font-family: inherit; font-size: 12px; color: var(--dim); background: transparent; border: 2px solid transparent;
    border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  #tabs button.on { color: var(--ink); background: var(--panel2); border-color: var(--line); }
  #items { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  #items::-webkit-scrollbar { display: none; }
  .item { position: relative; flex: 0 0 auto; width: 58px; height: 62px; border-radius: 8px; border: 2px solid var(--line); background: var(--panel2);
    color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0; font-family: inherit;
    transition: transform .08s; }
  .item:active { transform: scale(.94); }
  .item.on { border-color: var(--accent); background: #3a2d18; box-shadow: 0 0 0 2px rgba(255,207,74,.25); }
  .item .em { font-size: 26px; line-height: 1; }
  .item .nm { font-size: 10px; color: var(--dim); }
  .item.on .nm { color: var(--accent); }
  .item .key { position: absolute; top: 2px; left: 4px; font-size: 9px; color: #6a5a88; }
  @media (hover: none) { .item .key { display: none; } }
  @media (min-width: 700px) { #items { flex-wrap: wrap; } .item { width: 64px; height: 66px; } .item .em { font-size: 30px; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="top">
      <div id="title">이모지 샌드박스</div>
      <div id="count"></div>
      <div class="sp"></div>
      <button class="ctl" id="slow" title="슬로모션">🐢</button>
      <button class="ctl" id="pause" title="일시정지 (Space)">⏸️</button>
      <button class="ctl" id="clear" title="모두 지우기">🗑️</button>
    </div>
  </div>
  <div id="panel">
    <div id="hint"></div>
    <div id="tabs"></div>
    <div id="items"></div>
  </div>
</div>
